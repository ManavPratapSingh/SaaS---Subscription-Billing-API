spring:
  application:
    name: SaaS - Subscription and Billing API
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_db
    username: postgres
    password: ${db_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationPurpose12345}
  expiration: 86400000  # 24 hours in milliseconds

# File Upload Configuration
file:
  upload-dir: uploads/receipts

# Rate Limiting Configuration
rate-limit:
  requests-per-minute: 100

# Redis Configuration
spring:
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

# Cache TTL Configuration (in seconds)
cache:
  ttl:
    plans: 3600          # 1 hour
    users: 1800          # 30 minutes
    subscriptions: 300   # 5 minutes
